# The CopperScript workspace. One crate per layer; the `copper` crate builds
# the binary.
[workspace]
resolver = "3"
members = ["crates/*"]
# A plain `cargo build` or `cargo test` skips the two WebAssembly adapters and
# their wasm-bindgen proc-macro chain; `--workspace` (CI) and `-p` still reach them.
default-members = [
    "crates/copper",
    "crates/copper-antenna",
    "crates/copper-assembly",
    "crates/copper-cam",
    "crates/copper-drc",
    "crates/copper-editor",
    "crates/copper-emi",
    "crates/copper-fullwave",
    "crates/copper-json",
    "crates/copper-lang",
    "crates/copper-lsp",
    "crates/copper-panel",
    "crates/copper-pcb",
    "crates/copper-physical",
    "crates/copper-place",
    "crates/copper-report",
    "crates/copper-route",
    "crates/copper-state",
    "crates/copper-units",
]

[workspace.package]
# Must match pyproject.toml: `agent-guide` reports it as package_version.
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
# Pure-Rust FDTD solver behind antenna synthesis. Pinned exactly: its API is
# still unstable (0.0.x); the solver identity is recorded in every report.
ems = { version = "=0.0.5", default-features = false }
indexmap = "2"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
sha2 = "0.10"
unicode-general-category = "1"
copper-json = { path = "crates/copper-json" }
copper-lang = { path = "crates/copper-lang" }
copper-antenna = { path = "crates/copper-antenna" }
copper-assembly = { path = "crates/copper-assembly" }
copper-cam = { path = "crates/copper-cam" }
copper-lsp = { path = "crates/copper-lsp" }
copper-drc = { path = "crates/copper-drc" }
copper-editor = { path = "crates/copper-editor" }
copper-emi = { path = "crates/copper-emi" }
copper-fullwave = { path = "crates/copper-fullwave" }
copper-pcb = { path = "crates/copper-pcb" }
copper-panel = { path = "crates/copper-panel" }
copper-place = { path = "crates/copper-place" }
copper-physical = { path = "crates/copper-physical" }
copper-report = { path = "crates/copper-report" }
copper-route = { path = "crates/copper-route" }
copper-state = { path = "crates/copper-state" }
copper-units = { path = "crates/copper-units" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Output must not depend on hash iteration order (plan section 4).
disallowed_types = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

# Line tables keep panics and backtraces readable. Full debug info made the
# 125 debug test binaries take 25 GB.
[profile.dev]
debug = "line-tables-only"

# Third-party code is compiled once and rarely debugged: optimise it so debug
# tests that reach num-bigint, i_overlay or the FDTD solver run at speed.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Optimised tests without the release profile's whole-program settings:
# `cargo test --workspace --profile fast`. Same code generation semantics as
# release (no fast-math, same overflow behaviour), several times quicker to
# build than `--release`, whose single codegen unit and LTO apply to each of
# the 125 test binaries.
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true

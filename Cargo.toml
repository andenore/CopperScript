# The CopperScript workspace. One crate per layer; the `copper` crate builds
# the binary.
[workspace]
resolver = "3"
members = ["crates/*"]
# A plain `cargo build` or `cargo test` skips the two WebAssembly adapters and
# their wasm-bindgen proc-macro chain; `--workspace` (CI) and `-p` still reach them.
default-members = [
    "crates/copper",
    "crates/copper-antenna",
    "crates/copper-assembly",
    "crates/copper-cam",
    "crates/copper-drc",
    "crates/copper-editor",
    "crates/copper-emi",
    "crates/copper-extract",
    "crates/copper-fullwave",
    "crates/copper-json",
    "crates/copper-lang",
    "crates/copper-lsp",
    "crates/copper-panel",
    "crates/copper-pcb",
    "crates/copper-physical",
    "crates/copper-place",
    "crates/copper-report",
    "crates/copper-route",
    "crates/copper-sim",
    "crates/copper-simulate",
    "crates/copper-spice",
    "crates/copper-state",
    "crates/copper-units",
]

[workspace.package]
# `agent-guide` reports it as package_version; release tags are `v` + this.
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/andenore/CopperScript"
homepage = "https://andenore.github.io/CopperScript/"
# Published to crates.io: the binary as `copperscript`, its libraries as `copper-*` (the two WebAssembly
# adapters opt out). Internal path dependencies carry the version below; internal dev-dependencies are
# path-only, so publishing strips them and no dev-dependency cycle reaches the registry.
publish = true

[workspace.dependencies]
base64 = "0.22"
# Pure-Rust FDTD solver behind antenna synthesis. Pinned exactly: its API is
# still unstable (0.0.x); the solver identity is recorded in every report.
ems = { version = "=0.0.5", default-features = false }
indexmap = "2"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
sha2 = "0.10"
unicode-general-category = "1"
copper-json = { path = "crates/copper-json", version = "0.3.0" }
copper-lang = { path = "crates/copper-lang", version = "0.3.0" }
copper-antenna = { path = "crates/copper-antenna", version = "0.3.0" }
copper-assembly = { path = "crates/copper-assembly", version = "0.3.0" }
copper-cam = { path = "crates/copper-cam", version = "0.3.0" }
copper-lsp = { path = "crates/copper-lsp", version = "0.3.0" }
copper-drc = { path = "crates/copper-drc", version = "0.3.0" }
copper-editor = { path = "crates/copper-editor", version = "0.3.0" }
copper-emi = { path = "crates/copper-emi", version = "0.3.0" }
copper-extract = { path = "crates/copper-extract", version = "0.3.0" }
copper-fullwave = { path = "crates/copper-fullwave", version = "0.3.0" }
copper-pcb = { path = "crates/copper-pcb", version = "0.3.0" }
copper-panel = { path = "crates/copper-panel", version = "0.3.0" }
copper-place = { path = "crates/copper-place", version = "0.3.0" }
copper-physical = { path = "crates/copper-physical", version = "0.3.0" }
copper-report = { path = "crates/copper-report", version = "0.3.0" }
copper-route = { path = "crates/copper-route", version = "0.3.0" }
copper-sim = { path = "crates/copper-sim", version = "0.3.0" }
copper-simulate = { path = "crates/copper-simulate", version = "0.3.0" }
copper-spice = { path = "crates/copper-spice", version = "0.3.0" }
copper-state = { path = "crates/copper-state", version = "0.3.0" }
copper-units = { path = "crates/copper-units", version = "0.3.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Output must not depend on hash iteration order (plan section 4).
disallowed_types = "deny"

[profile.release]
codegen-units = 1
lto = "thin"

# Line tables keep panics and backtraces readable. Full debug info made the
# 125 debug test binaries take 25 GB.
[profile.dev]
debug = "line-tables-only"

# Third-party code is compiled once and rarely debugged: optimise it so debug
# tests that reach num-bigint, i_overlay or the FDTD solver run at speed.
[profile.dev.package."*"]
debug = false
opt-level = 2

# The extraction crate and the partial-inductance closed forms it calls spend
# their time in dense complex elimination and 64-term Hoer-Love sums; unoptimised
# they are some twenty times slower. There was no per-crate precedent here (only
# the third-party rule above), so these two workspace crates are named
# explicitly; overflow checks stay on.
[profile.dev.package.copper-extract]
opt-level = 2

[profile.dev.package.copper-emi]
opt-level = 2

# Optimised tests without the release profile's whole-program settings:
# `cargo test --workspace --profile fast`. Same code generation semantics as
# release (no fast-math, same overflow behaviour), several times quicker to
# build than `--release`, whose single codegen unit and LTO apply to each of
# the 125 test binaries.
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true

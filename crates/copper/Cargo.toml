[package]
# Published as `copperscript` (`copper` on crates.io is another project); the command it installs is `copper`.
name = "copperscript"
description = "The CopperScript command line: PCB design as code (installs the `copper` command)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["pcb", "eda", "kicad", "electronics", "hardware"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "copper"
path = "src/main.rs"

[dependencies]
copper-json.workspace = true
copper-lang.workspace = true
copper-lsp.workspace = true
copper-physical.workspace = true
copper-antenna.workspace = true
copper-assembly.workspace = true
copper-cam.workspace = true
copper-drc.workspace = true
copper-emi.workspace = true
copper-editor.workspace = true
copper-extract.workspace = true
copper-fullwave.workspace = true
copper-pcb.workspace = true
copper-panel.workspace = true
copper-place.workspace = true
copper-report.workspace = true
copper-route.workspace = true
copper-simulate.workspace = true
copper-units.workspace = true
copper-state.workspace = true
indexmap.workspace = true
sha2.workspace = true

[dev-dependencies]
copper-json = { path = "../copper-json" }
copper-route = { path = "../copper-route" }
copper-state = { path = "../copper-state" }

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true

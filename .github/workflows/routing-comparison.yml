name: Compare full-vertical routing against a baseline

# Routes the full-vertical example twice on matched runners: at the baseline
# commit named in .github/routing-comparison.json and at the pushed commit.
# Unprofiled, same settings as the release route job. Measurements only:
# never signoff, fabrication readiness or an automatic acceptance gate.
on:
  push:
    branches: ['claude/plan-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refs:
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.read.outputs.baseline }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read baseline commit
        id: read
        run: |
          python3 -c 'import json; print("baseline=" + json.load(open(".github/routing-comparison.json"))["baseline_ref"])' >> "$GITHUB_OUTPUT"

  route:
    needs: refs
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - name: Keep source bytes canonical on this ephemeral runner
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          ref: ${{ matrix.side == 'baseline' && needs.refs.outputs.baseline || github.sha }}
          persist-credentials: false
      - name: Check out the candidate's CI tools (one KiCad for both sides)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci-tools
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_install_kicad10.sh
            .github/board-toolchain.json
          sparse-checkout-cone-mode: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build tools and local package
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.3.0 pyproject-hooks==1.2.0 packaging==25.0 pygerber==2.4.3 numpy==2.3.3
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch locked URL dependencies into managed cache and record provenance
        run: python scripts/ci_board_bundle.py prepare
      - name: Restore cached KiCad packages
        id: kicad-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: kicad10-debs-${{ hashFiles('ci-tools/.github/board-toolchain.json') }}
      - name: Install KiCad 10 and bundled footprint libraries
        env:
          KICAD_DEB_CACHE: /home/runner/kicad-debs
          KICAD_PINS: ${{ github.workspace }}/ci-tools/.github/board-toolchain.json
        run: bash "$GITHUB_WORKSPACE/ci-tools/scripts/ci_install_kicad10.sh"
      - name: Save KiCad packages for later runs
        if: steps.kicad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: ${{ steps.kicad-cache.outputs.cache-primary-key }}
      - name: Route full-vertical without profiling
        run: |
          set +e
          make --no-print-directory EXAMPLE=full-vertical route PYTHON=python PROFILE=none \
            KICAD_CLI=/usr/bin/kicad-cli KICAD_FOOTPRINTS=/usr/share/kicad/footprints \
            "RESOLVE_ARGS=--locked --offline" PLACEMENT_TEMPLATES= \
            RUN_DIR="$PWD/build/comparison/${{ matrix.side }}" 2>&1 | tee "$RUNNER_TEMP/route-output.txt"
          code=${PIPESTATUS[0]}
          echo "route exit code $code (unmet gates exit 1; the run manifest is authoritative)"
          git rev-parse HEAD > "build/comparison/${{ matrix.side }}/source-commit.txt"
          python -c 'import json, sys; m = json.load(open(sys.argv[1])); print("::notice title=Route ${{ matrix.side }}::status=%s exit_code=%s elapsed_seconds=%s commit=%s" % (m.get("status"), m.get("exit_code"), m.get("elapsed_seconds"), sys.argv[2]))' \
            "build/comparison/${{ matrix.side }}/run.json" "$(git rev-parse --short HEAD)" || true
          # Located causes and the end of the route output, also as annotations.
          python -m copperscript issues "build/comparison/${{ matrix.side }}" --limit 20 > "$RUNNER_TEMP/issues.txt" 2>&1
          for item in "issues.txt:Issues ${{ matrix.side }}" "route-output.txt:Route output tail ${{ matrix.side }}"; do
            tail -n 60 "$RUNNER_TEMP/${item%%:*}" | python -c 'import sys; t = sys.stdin.read(); print("::notice title=" + sys.argv[1] + "::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "${item#*:}" || true
          done
      - name: Preserve the run directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routing-${{ matrix.side }}
          path: CopperScript/build/comparison/${{ matrix.side }}
          if-no-files-found: error

  compare:
    needs: route
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build tools and local package
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: CopperScript/build/comparison
      - name: Summarize and compare
        run: |
          set +e
          python -m pcbir.routing_benchmark summarize build/comparison/routing-baseline > build/comparison/baseline-summary.json
          python -m pcbir.routing_benchmark summarize build/comparison/routing-candidate > build/comparison/candidate-summary.json
          python -m pcbir.routing_benchmark compare build/comparison/routing-baseline build/comparison/routing-candidate > build/comparison/comparison.json
          echo "compare exit code $? (0 timing-eligible, 1 quality regression, 2 not comparable)"
          python -m pcbir.routing_benchmark table build/comparison/routing-baseline build/comparison/routing-candidate > build/comparison/table.md
          cat build/comparison/table.md >> "$GITHUB_STEP_SUMMARY"
          # The same table as an annotation, which the checks API also exposes.
          python -c 'import sys; t = open(sys.argv[1], encoding="utf-8").read(); print("::notice title=Routing comparison::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' build/comparison/table.md
          exit 0
      - name: Preserve summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routing-comparison
          path: CopperScript/build/comparison/*.json
          if-no-files-found: warn

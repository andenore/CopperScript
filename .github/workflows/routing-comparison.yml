name: Compare full-vertical routing against a baseline

# Routes the full-vertical example twice on matched runners: at the baseline
# commit named in .github/routing-comparison.json and at the pushed commit.
# Unprofiled, same settings as the release route job. Measurements only:
# never signoff, fabrication readiness or an automatic acceptance gate.
on:
  push:
    branches: ['claude/plan-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refs:
    runs-on: ubuntu-24.04
    outputs:
      baseline: ${{ steps.read.outputs.baseline }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read baseline commit
        id: read
        run: |
          python3 -c 'import json; print("baseline=" + json.load(open(".github/routing-comparison.json"))["baseline_ref"])' >> "$GITHUB_OUTPUT"

  route:
    needs: refs
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - name: Keep source bytes canonical on this ephemeral runner
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          ref: ${{ matrix.side == 'baseline' && needs.refs.outputs.baseline || github.sha }}
          persist-credentials: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build tools and local package
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.3.0 pyproject-hooks==1.2.0 packaging==25.0 pygerber==2.4.3
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch locked URL dependencies into managed cache and record provenance
        run: python scripts/ci_board_bundle.py prepare
      - name: Install KiCad 10 and bundled footprint libraries
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad make
          expected=$(python -c 'import json; print(json.load(open(".github/board-toolchain.json"))["kicad_version"])')
          actual=$(kicad-cli version)
          test "$actual" = "$expected"
      - name: Route full-vertical without profiling
        run: |
          set +e
          make --no-print-directory EXAMPLE=full-vertical route PYTHON=python PROFILE=none \
            KICAD_CLI=/usr/bin/kicad-cli KICAD_FOOTPRINTS=/usr/share/kicad/footprints \
            "RESOLVE_ARGS=--locked --offline" PLACEMENT_TEMPLATES= \
            RUN_DIR="$PWD/build/comparison/${{ matrix.side }}"
          echo "route exit code $? (unmet gates exit 1; the run manifest is authoritative)"
          git rev-parse HEAD > "build/comparison/${{ matrix.side }}/source-commit.txt"
      - name: Preserve the run directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routing-${{ matrix.side }}
          path: CopperScript/build/comparison/${{ matrix.side }}
          if-no-files-found: error

  compare:
    needs: route
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install local package
        run: python -m pip install --no-build-isolation --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: CopperScript/build/comparison
      - name: Summarize and compare
        run: |
          set +e
          python -m pcbir.routing_benchmark summarize build/comparison/routing-baseline > build/comparison/baseline-summary.json
          python -m pcbir.routing_benchmark summarize build/comparison/routing-candidate > build/comparison/candidate-summary.json
          python -m pcbir.routing_benchmark compare build/comparison/routing-baseline build/comparison/routing-candidate > build/comparison/comparison.json
          echo "compare exit code $? (0 timing-eligible, 1 quality regression, 2 not comparable)"
          python -m pcbir.routing_benchmark table build/comparison/routing-baseline build/comparison/routing-candidate >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Preserve summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: routing-comparison
          path: CopperScript/build/comparison/*.json
          if-no-files-found: warn

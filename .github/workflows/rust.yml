name: Rust

# Builds, lints and tests the Rust workspace, exercises the Make targets of
# every example, and routes the benchmark ladder with the `copper` binary.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/rust.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'crates/**'
      - 'examples/**'
      - 'tests/**'
      - 'bench/**'
      - 'Makefile'
      - 'make/**'
      - 'scripts/ci_install_kicad10.sh'
      - '.github/board-toolchain.json'
      - '.gitattributes'
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'crates/**'
      - 'examples/**'
      - 'tests/**'
      - 'bench/**'
      - 'Makefile'
      - 'make/**'
      - 'scripts/ci_install_kicad10.sh'
      - '.github/board-toolchain.json'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the binary
        run: cargo build --release --locked -p copper
      - name: Populate the package cache
        # Locked online checks fetch every board's pinned packages into its
        # .copper-cache without changing copper.lock, and a locked online
        # footprint audit fetches the KiCad footprint libraries they resolve
        # from; the tests then run offline, as locally. Boards that fail ERC or
        # the audit still fetch.
        run: |
          for board in examples/*/board.copper examples/simulation/*.copper; do
            target/release/copper check "$board" --locked > /dev/null || true
            target/release/copper audit-footprints "$board" --locked > /dev/null || true
          done
      - name: Test
        run: cargo test --workspace --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: copper-${{ runner.os }}
          path: |
            target/release/copper
            target/release/copper.exe
          if-no-files-found: warn

  make-targets:
    # The root Makefile's targets for every registered example, with the
    # installed binary: check, compile and a dry-run route for each, then
    # layout and an editor scene for the physical examples.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install copper
        run: |
          cargo install --locked --path crates/copper --root "$RUNNER_TEMP/copper"
          echo "$RUNNER_TEMP/copper/bin" >> "$GITHUB_PATH"
      - name: Restore cached KiCad packages
        id: kicad-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: kicad10-debs-${{ hashFiles('.github/board-toolchain.json') }}
      - name: Install KiCad 10 and its footprint libraries (pinned Ubuntu packages)
        env:
          KICAD_DEB_CACHE: /home/runner/kicad-debs
        run: bash scripts/ci_install_kicad10.sh
      - name: Populate the package cache
        run: |
          for board in examples/*/board.copper; do
            copper check "$board" --locked > /dev/null || true
            copper audit-footprints "$board" --locked > /dev/null || true
          done
      - name: Exercise Make targets for every example
        env:
          RESOLVE_ARGS: --locked --offline
        run: |
          set -euo pipefail
          mkdir -p build/make-target-smoke
          make --no-print-directory check-examples
          physical_examples="$(make --no-print-directory -s --eval='print-physical-examples:;@echo $(PHYSICAL_EXAMPLES)' print-physical-examples)"
          for example in $physical_examples; do
            echo "::group::${example} layout"
            make --no-print-directory EXAMPLE="$example" layout
            echo "::endgroup::"
            echo "::group::${example} edit"
            make --no-print-directory EXAMPLE="$example" \
              EDITOR_ARGS="--no-browser --scene-output build/make-target-smoke/${example}/scene.json" \
              edit
            echo "::endgroup::"
          done

  ladder:
    # Every ladder board routed by the Rust binary (`copper bench`), the
    # consumer boards included, with KiCad's native DRC (--verify-plane-fill)
    # where a board asks for it. A board that errors (not implemented, a
    # crash, no report) or times out fails the job; with a committed
    # bench/ladder-baseline.json, a completion, DRC or native-connectivity
    # regression against it fails it too. A board whose repository is not
    # checked out (CopperProbe without its token) is skipped.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rust-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # CopperProbe is private: its board runs only when this token can read it.
      HAS_BOARDS_TOKEN: ${{ secrets.COPPER_BOARDS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: andenore/CopperLedRing
          path: boards/CopperLedRing
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: andenore/CopperAssetTracker
          path: boards/CopperAssetTracker
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_BOARDS_TOKEN == 'true'
        with:
          repository: andenore/CopperProbe
          path: boards/CopperProbe
          token: ${{ secrets.COPPER_BOARDS_TOKEN }}
          persist-credentials: false
      - name: Keep the consumer checkouts out of this repository's status
        run: echo "/boards/" >> .git/info/exclude
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the binary
        run: cargo build --release --locked -p copper
      - name: Restore cached KiCad packages
        id: kicad-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: kicad10-debs-${{ hashFiles('.github/board-toolchain.json') }}
      - name: Install KiCad 10 and its footprint libraries (pinned Ubuntu packages)
        env:
          KICAD_DEB_CACHE: /home/runner/kicad-debs
        run: bash scripts/ci_install_kicad10.sh
      - name: Save KiCad packages for later runs
        if: steps.kicad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: ${{ steps.kicad-cache.outputs.cache-primary-key }}
      - name: Populate the package caches
        # As in build-and-test, plus the consumer boards; the ladder then runs
        # offline where its arguments ask for it.
        run: |
          for board in examples/*/board.copper boards/*/board.copper; do
            target/release/copper check "$board" --locked > /dev/null || true
            target/release/copper audit-footprints "$board" --locked > /dev/null || true
          done
      - name: Route the ladder
        env:
          COPPER_BOARDS: ${{ github.workspace }}/boards
          KICAD_FOOTPRINTS: /usr/share/kicad/footprints
        run: |
          baseline=()
          if [ -f bench/ladder-baseline.json ]; then baseline=(--baseline bench/ladder-baseline.json); fi
          target/release/copper bench --out build/bench --label "${GITHUB_SHA::7}" --kicad-cli "$KICAD_CLI" \
            --jobs 2 "${baseline[@]}" bench/ladder.json
      - name: Fail on boards that errored or timed out
        run: |
          jq -r '.results[] | select(.status == "error" or .status == "timeout")
                 | "\(.name): \(.status) \(.reason // "")"' build/bench/results.json | tee build/bench/failed.txt
          test ! -s build/bench/failed.txt
      - name: Publish the ladder summary
        if: always()
        run: |
          if [ -f build/bench/results.md ]; then cat build/bench/results.md >> "$GITHUB_STEP_SUMMARY"; fi
          # The full results, for refreshing bench/ladder-baseline.json from the log.
          if [ -f build/bench/results.json ]; then echo "LADDER-RESULTS $(jq -c . build/bench/results.json)"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ladder-Linux
          path: |
            build/bench/results.json
            build/bench/results.md
          if-no-files-found: warn

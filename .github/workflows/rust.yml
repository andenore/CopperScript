name: Rust rewrite

# Builds and tests the Rust workspace and compares the `copper` binary with the
# Python CLI on the gated corpus suites (docs/rust-port-plan.md).
# Python changes trigger it too: the Python CLI is the oracle, so a change to
# its output shows up here as a stale fixture or a differing case.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/rust.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'crates/**'
      - 'scripts/compare_implementations.py'
      - 'scripts/compare_corpus.json'
      - 'scripts/generate_rust_fixtures.py'
      - 'docs/rust-port-differences.md'
      - 'bench/ladder.json'
      - 'pcbir/**'
      - 'copperscript/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/ci_install_kicad10.sh'
      - '.github/board-toolchain.json'
      - 'pyproject.toml'
      - '.gitattributes'
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'crates/**'
      - 'scripts/compare_implementations.py'
      - 'scripts/compare_corpus.json'
      - 'scripts/generate_rust_fixtures.py'
      - 'docs/rust-port-differences.md'
      - 'bench/ladder.json'
      - 'pcbir/**'
      - 'copperscript/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/ci_install_kicad10.sh'
      - '.github/board-toolchain.json'
      - 'pyproject.toml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install the Python oracle
        # Python proves macro edge openings with shapely (the qualification extra).
        run: python -m pip install -e ".[test]" "shapely==2.1.2"
      - name: Populate the package cache
        # Locked online checks fetch every board's pinned packages into its
        # .copper-cache without changing copper.lock, and a locked online
        # footprint audit fetches the KiCad footprint libraries they resolve
        # from; tests and the comparison then run offline, as locally. Boards
        # that fail ERC or the audit still fetch.
        run: |
          for board in examples/*/board.copper examples/simulation/*.copper; do
            python -m copperscript check "$board" --locked > /dev/null || true
            python -m copperscript audit-footprints "$board" --locked > /dev/null || true
          done
      - name: Test
        run: cargo test --workspace --locked
      - name: Build the binary
        run: cargo build --release --locked -p copper
      - name: Check the oracle fixtures are current
        run: python scripts/generate_rust_fixtures.py --check
      - name: Key the oracle cache
        # Python results stay valid while the non-Rust tree and the
        # interpreter's packages are unchanged; Rust-only pushes reuse them.
        id: oracle
        run: echo "digest=$(python scripts/compare_implementations.py --print-oracle-digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the oracle cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/oracle-cache
          key: oracle-${{ runner.os }}-${{ steps.oracle.outputs.digest }}-${{ github.run_id }}
          restore-keys: oracle-${{ runner.os }}-${{ steps.oracle.outputs.digest }}-
      - name: Compare the binary with the Python CLI
        run: python scripts/compare_implementations.py --jobs 4 --report build/compare/report.json --markdown build/compare/report.md
      - name: Save the oracle cache
        if: always() && steps.oracle.outputs.digest != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/oracle-cache
          key: oracle-${{ runner.os }}-${{ steps.oracle.outputs.digest }}-${{ github.run_id }}
      - name: Publish the comparison summary
        if: always()
        run: |
          if [ -f build/compare/report.md ]; then cat build/compare/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: copper-${{ runner.os }}
          path: |
            target/release/copper
            target/release/copper.exe
            build/compare/
          if-no-files-found: warn

  ladder:
    # The M4 acceptance run: every ladder board on both implementations, the
    # consumer boards included, with KiCad's native DRC (--verify-plane-fill)
    # where a board asks for it. Gated at M4: a differing board, or one the
    # Rust binary reports as not implemented, fails the job; a board whose
    # repository is not checked out (CopperProbe without its token) is skipped.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rust-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # CopperProbe is private: its board runs only when this token can read it.
      HAS_BOARDS_TOKEN: ${{ secrets.COPPER_BOARDS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: andenore/CopperLedRing
          path: boards/CopperLedRing
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: andenore/CopperAssetTracker
          path: boards/CopperAssetTracker
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.HAS_BOARDS_TOKEN == 'true'
        with:
          repository: andenore/CopperProbe
          path: boards/CopperProbe
          token: ${{ secrets.COPPER_BOARDS_TOKEN }}
          persist-credentials: false
      - name: Keep the consumer checkouts out of this repository's status
        run: echo "/boards/" >> .git/info/exclude
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the binary
        run: cargo build --release --locked -p copper
      - name: Install the Python oracle
        run: python -m pip install -e ".[test]" "shapely==2.1.2"
      - name: Restore cached KiCad packages
        id: kicad-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: kicad10-debs-${{ hashFiles('.github/board-toolchain.json') }}
      - name: Install KiCad 10 and its footprint libraries (pinned Ubuntu packages)
        env:
          KICAD_DEB_CACHE: /home/runner/kicad-debs
        run: bash scripts/ci_install_kicad10.sh
      - name: Save KiCad packages for later runs
        if: steps.kicad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: ${{ steps.kicad-cache.outputs.cache-primary-key }}
      - name: Populate the package caches
        # As in the comparison job, plus the consumer boards; the ladder then
        # runs offline where its arguments ask for it.
        run: |
          for board in examples/*/board.copper boards/*/board.copper; do
            python -m copperscript check "$board" --locked > /dev/null || true
            python -m copperscript audit-footprints "$board" --locked > /dev/null || true
          done
      - name: Route the ladder on both implementations
        env:
          COPPER_BOARDS: ${{ github.workspace }}/boards
          KICAD_FOOTPRINTS: /usr/share/kicad/footprints
        run: >-
          python scripts/compare_implementations.py --suite ladder --milestone M4 --kicad-cli "$KICAD_CLI" --jobs 2
          --report build/compare/ladder.json --markdown build/compare/ladder.md
      - name: Publish the ladder summary
        if: always()
        run: |
          if [ -f build/compare/ladder.md ]; then cat build/compare/ladder.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ladder-Linux
          path: build/compare/
          if-no-files-found: warn

name: Test CopperScript and route release boards

on:
  push:
    branches: ['**']
    tags: ['v*']

# No pull_request_target, untrusted PR code or persistent self-hosted runners.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - name: Keep source bytes canonical on this ephemeral runner
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build/test tools and local package
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.3.0 pyproject-hooks==1.2.0 packaging==25.0 pytest==8.4.2 iniconfig==2.3.0 pluggy==1.6.0 pygments==2.19.2 colorama==0.4.6 pygerber==2.4.3 matplotlib==3.10.6 plotly==6.3.0
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch locked URL dependencies into managed cache and record provenance
        run: python scripts/ci_board_bundle.py prepare
      - name: Install KiCad 10 and bundled footprint libraries
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad make
          expected=$(python -c 'import json; print(json.load(open(".github/board-toolchain.json"))["kicad_version"])')
          actual=$(kicad-cli version)
          test "$actual" = "$expected"
          echo 'KICAD_CLI=/usr/bin/kicad-cli' >> "$GITHUB_ENV"
          echo 'KICAD10_FOOTPRINT_DIR=/usr/share/kicad/footprints' >> "$GITHUB_ENV"
      - name: Exercise Make targets for every example
        env:
          PYTHON: python
          RESOLVE_ARGS: --locked --offline
        run: |
          set -euo pipefail
          mkdir -p build/make-target-smoke
          make --no-print-directory check-examples

          physical_examples="$(make --no-print-directory -s --eval='print-physical-examples:;@echo $(PHYSICAL_EXAMPLES)' print-physical-examples)"
          for example in $physical_examples; do
            echo "::group::${example} layout"
            make --no-print-directory EXAMPLE="$example" layout
            echo "::endgroup::"

            echo "::group::${example} edit"
            make --no-print-directory EXAMPLE="$example" \
              EDITOR_ARGS="--no-browser --scene-output build/make-target-smoke/${example}/scene.json" \
              edit
            echo "::endgroup::"
          done
      - name: Install pinned ngspice
        run: |
          sudo apt-get install --yes build-essential bison flex
          python scripts/ci_simulation.py install --prefix "$RUNNER_TEMP/copper-ngspice"
          echo "NGSPICE=$RUNNER_TEMP/copper-ngspice/bin/ngspice" >> "$GITHUB_ENV"
          echo 'COPPER_SIM_REQUIRED=1' >> "$GITHUB_ENV"
      - name: Run complete test suite
        id: complete-tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest 2>&1 | tee build/pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -c 3500 build/pytest.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Complete test suite failed::${summary}"
            exit "$status"
          fi
      - name: Annotate complete test failures
        if: steps.complete-tests.outcome == 'failure'
        run: exit 1
      - name: Package shared mechanical editor (offline VSIX)
        run: |
          node integrations/vscode/build.cjs
          python integrations/vscode/package.py -o build/editor-dist/copperscript-mechanical.vsix
          python -m pcbir.editor.document --fingerprint > build/editor-dist/compiler-fingerprint.txt
      - name: Preserve editor release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mechanical-editor-${{ github.sha }}
          path: CopperScript/build/editor-dist
          if-no-files-found: error
      - name: Generate bounded simulation examples
        if: always()
        run: python scripts/ci_simulation.py examples
      - name: Simulation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulation-reports
          path: CopperScript/build/sim
          if-no-files-found: warn
  route:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: test
    concurrency:
      group: board-routing-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - name: Keep source bytes canonical on this ephemeral runner
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build/test tools and local package
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 build==1.3.0 pyproject-hooks==1.2.0 packaging==25.0 pytest==8.4.2 iniconfig==2.3.0 pluggy==1.6.0 pygments==2.19.2 colorama==0.4.6 pygerber==2.4.3
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Fetch locked URL dependencies into managed cache and record provenance
        run: python scripts/ci_board_bundle.py prepare
      - name: Install KiCad 10 and bundled footprint libraries
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad make
          expected=$(python -c 'import json; print(json.load(open(".github/board-toolchain.json"))["kicad_version"])')
          actual=$(kicad-cli version)
          test "$actual" = "$expected"
          echo 'KICAD_CLI=/usr/bin/kicad-cli' >> "$GITHUB_ENV"
          echo 'KICAD10_FOOTPRINT_DIR=/usr/share/kicad/footprints' >> "$GITHUB_ENV"
      - name: Attempt complete routing (never a dry run)
        run: python scripts/ci_board_bundle.py route --minutes 270
      - name: Build source distributions and pinned library snapshot
        if: always()
        run: |
          mkdir -p build/ci-dist
          python -m build --no-isolation --outdir build/ci-dist
          node integrations/vscode/build.cjs
          python integrations/vscode/package.py -o build/ci-dist/copperscript-mechanical.vsix
          python -m pcbir.editor.document --fingerprint > build/ci-dist/compiler-fingerprint.txt
          git archive --format=zip --output=build/ci-dist/copperscript-sources.zip HEAD
          python scripts/ci_board_bundle.py sources
      - name: Refill, inspect layers and package all available results
        if: always()
        run: python scripts/ci_board_bundle.py package
      - name: Preserve inspection bundles even for blocked or failed routes
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-inspection-${{ github.sha }}-${{ github.run_attempt }}
          path: CopperScript/build/ci-dist/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Keep failed, incomplete and timed-out runs visible as failures
        if: always()
        run: python scripts/ci_board_bundle.py check

  publish:
    # Separate write token from the expensive source-building/routing job.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.route.outputs.artifact_id != '' }}
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.route.outputs.artifact_id }}
          path: inspection-assets
      - name: Publish tagged inspection prerelease with every generated asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_publish_release.py inspection-assets

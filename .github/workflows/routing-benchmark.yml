name: Route the PCBWorld D3 benchmark boards

# Routes PCBWorld's D3 evaluation boards (by default D3-A: the 99 easy test
# boards, all from PCBench) with their placements held fixed, writes the copper
# back into each original KiCad board and scores it with stock kicad-cli DRC
# under the board's own project rules. Pins live in
# .github/routing-benchmark.json. Measurements only: never signoff,
# fabrication readiness or an automatic acceptance gate.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Route only the first N boards of the tier (0 = all)
        default: '0'
  push:
    branches: ['claude/**']
    paths:
      - pcbir/bench.py
      - pcbir/importers/kicad_pcb.py
      - .github/routing-benchmark.json
      - .github/workflows/routing-benchmark.yml

permissions:
  contents: read

concurrency:
  group: routing-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      board_seconds: ${{ steps.plan.outputs.board_seconds }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read benchmark pins
        id: plan
        run: |
          python3 - "${{ github.event.inputs.limit || '0' }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          pins = json.load(open("CopperScript/.github/routing-benchmark.json"))
          for key in ("pcbworld_repository", "pcbworld_ref", "pcbench_repository", "pcbench_ref",
                      "kicad_ppa", "kicad_series", "tier", "split", "board_seconds"):
              print(f"{key}={pins[key]}")
          print("limit=" + sys.argv[1])
          print("shards=" + json.dumps(list(range(pins["shards"]))))
          print(f"shard_count={pins['shards']}")
          PY
      - name: Install stock KiCad 9 (board preparation and the scorer)
        run: |
          sudo add-apt-repository --yes "${{ steps.plan.outputs.kicad_ppa }}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad python3-yaml
          kicad-cli version | tee "$RUNNER_TEMP/kicad-version.txt"
          case "$(kicad-cli version)" in "${{ steps.plan.outputs.kicad_series }}".*) ;; *) echo "unexpected KiCad"; exit 1;; esac
          /usr/bin/python3 -c 'import pcbnew; print("pcbnew", pcbnew.Version())'
      - name: Fetch PCBWorld and the selected PCBench boards at their pinned commits
        run: |
          fetch() {  # fetch <dir> <repository> <commit>
            git init --quiet "$1" && git -C "$1" remote add origin "$2"
            git -C "$1" fetch --quiet --depth 1 --filter=blob:none origin "$3"
          }
          fetch PCBWorld "${{ steps.plan.outputs.pcbworld_repository }}" "${{ steps.plan.outputs.pcbworld_ref }}"
          git -C PCBWorld checkout --quiet FETCH_HEAD
          python3 - PCBWorld/configs/datasets/d3.json "${{ steps.plan.outputs.tier }}" "${{ steps.plan.outputs.split }}" \
            "${{ steps.plan.outputs.limit }}" > boards.txt <<'PY'
          import json, sys
          d3 = json.load(open(sys.argv[1]))
          names = d3[sys.argv[2]][sys.argv[3]]
          limit = int(sys.argv[4])
          print("\n".join(names[:limit] if limit else names))
          PY
          echo "$(wc -l < boards.txt) boards selected"
          fetch PCBench "${{ steps.plan.outputs.pcbench_repository }}" "${{ steps.plan.outputs.pcbench_ref }}"
          sed 's/^[0-9]*_//; s|.*|/PCBs/&/|' boards.txt | git -C PCBench sparse-checkout set --no-cone --stdin
          git -C PCBench checkout --quiet FETCH_HEAD
          test "$(ls PCBench/PCBs | wc -l)" = "$(wc -l < boards.txt)"
      - name: Prepare boards with PCBWorld's chain (KiCad 9 conversion, DRC repair, guide widths)
        working-directory: PCBWorld
        env:
          KICAD_CLI: /usr/bin/kicad-cli
          PCBNEW_PYTHON: /usr/bin/python3
          PCBENCH_PCBS_ROOT: ${{ github.workspace }}/PCBench/PCBs
          PCBENCH_V9_ROOT: ${{ github.workspace }}/work/v9
          PCBENCH_NEWDRC_OUT: ${{ github.workspace }}/work/newdrc
          # drc_fix_v9.py imports PCBWorld's configs package without adding the repository to sys.path.
          PYTHONPATH: ${{ github.workspace }}/PCBWorld
        run: |
          PP=tools/datagen/pcbench_prep
          # Each step's output tail also becomes an annotation (job logs are not always reachable).
          step() {
            local title=$1; shift
            set +e; "$@" > "$RUNNER_TEMP/step.txt" 2>&1; local code=$?; set -e
            tail -n 40 "$RUNNER_TEMP/step.txt" | python3 -c 'import sys; t = sys.stdin.read(); print(("::error" if sys.argv[2] != "0" else "::notice") + " title=" + sys.argv[1] + " (exit " + sys.argv[2] + ")::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' "$title" "$code"
            return $code
          }
          step convert_v9 /usr/bin/python3 $PP/convert_v9.py --workers 4
          step drc_fix_v9 /usr/bin/python3 $PP/drc_fix_v9.py --workers 4
          step make_guide /usr/bin/python3 $PP/make_guide.py --base-dir "$PCBENCH_NEWDRC_OUT" --stem processed_v9 \
            --suffix _guide_v3 --workers 4 --log "$RUNNER_TEMP/make_guide_log.json"
      - name: Collect the benchmark boards under their D3 names
        run: |
          mkdir -p boards
          missing=0
          while read -r id; do
            name="${id#*_}"; src="work/newdrc/$name"
            if [ -f "$src/processed_v9_guide_v3.kicad_pcb" ] && [ -f "$src/processed_v9_guide_v3.kicad_pro" ]; then
              mkdir -p "boards/$id"
              cp "$src/processed_v9_guide_v3.kicad_pcb" "$src/processed_v9_guide_v3.kicad_pro" "boards/$id/"
            else
              echo "::warning title=Board not prepared::$id"; missing=$((missing + 1))
            fi
          done < boards.txt
          cp boards.txt "$RUNNER_TEMP/kicad-version.txt" boards/
          echo "::notice title=Benchmark boards::$(ls -d boards/*/ | wc -l) prepared, $missing missing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-boards
          path: boards
          if-no-files-found: error

  route:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read committed toolchain pins
        id: pins
        run: |
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build tools and local package
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-boards
          path: boards
      - name: Route this shard's boards with fixed placement
        run: |
          shards=${{ needs.prepare.outputs.shard_count }}
          index=0
          for dir in ../boards/*/; do
            id=$(basename "$dir")
            if [ $((index % shards)) = "${{ matrix.shard }}" ]; then
              timeout --kill-after=30 "${{ needs.prepare.outputs.board_seconds }}" \
                python -m pcbir.bench route "$dir/processed_v9_guide_v3.kicad_pcb" --out "../results/$id" \
                > "../results-$id.log" 2>&1 || echo "$id exited $?"
              tail -n 1 "../results-$id.log"
              mkdir -p "../results/$id" && mv "../results-$id.log" "../results/$id/route.log"
            fi
            index=$((index + 1))
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-results-${{ matrix.shard }}
          path: results
          if-no-files-found: warn

  score:
    needs: [prepare, route]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: CopperScript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperScript
          persist-credentials: false
      - name: Read benchmark pins
        id: pins
        run: |
          python3 -c 'import json; p = json.load(open(".github/routing-benchmark.json")); print("kicad_ppa=" + p["kicad_ppa"])' >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("python=" + json.load(open(".github/board-toolchain.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install pinned build tools, local package and stock KiCad 9
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation --no-deps -e .
          sudo add-apt-repository --yes "${{ steps.pins.outputs.kicad_ppa }}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-boards
          path: boards
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bench-results-*
          path: results
          merge-multiple: true
      - name: Score routed boards and the original routing with kicad-cli DRC
        run: |
          mkdir -p ../results ../reference
          for dir in ../boards/*/; do
            id=$(basename "$dir")
            # A board whose run never wrote a record (lost shard) still counts against the pass rate.
            [ -f "../results/$id/result.json" ] || { mkdir -p "../results/$id"; printf '{"board": "%s", "status": "missing"}\n' "$id" > "../results/$id/result.json"; }
            python -m pcbir.bench score "../results/$id" --kicad-cli /usr/bin/kicad-cli --pcbnew-python /usr/bin/python3 > /dev/null || echo "$id score failed"
            python -m pcbir.bench reference "$dir/processed_v9_guide_v3.kicad_pcb" --out "../reference/$id" > /dev/null
            python -m pcbir.bench score "../reference/$id" --kicad-cli /usr/bin/kicad-cli --pcbnew-python /usr/bin/python3 > /dev/null || echo "$id reference score failed"
          done
      - name: Summarize
        run: |
          {
            echo "## CopperScript on PCBWorld D3 boards"
            python -m pcbir.bench summarize ../results --markdown
            echo "### Scorer check: the boards' own routing"
            python -m pcbir.bench summarize ../reference --markdown
            echo "### Boards"
            python -m pcbir.bench boards ../results
          } > ../summary.md
          cat ../summary.md >> "$GITHUB_STEP_SUMMARY"
          python -c 'import sys; t = open(sys.argv[1], encoding="utf-8").read()[:60000]; print("::notice title=Routing benchmark::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' ../summary.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-scored
          path: |
            results
            reference
            summary.md
          if-no-files-found: warn

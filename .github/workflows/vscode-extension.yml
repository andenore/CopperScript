name: CopperScript VS Code extension

on:
  push:
    branches: ['**']
    tags: ['extension-v*']
    paths:
      - '.github/workflows/vscode-extension.yml'
      - 'integrations/vscode/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/*.cjs'
      - 'copper.mod'
      - 'copper.lock'
      - 'examples/**'
  pull_request:
    paths:
      - '.github/workflows/vscode-extension.yml'
      - 'integrations/vscode/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/*.cjs'
      - 'copper.mod'
      - 'copper.lock'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the pinned Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build the copper binary
        run: cargo build --release --locked -p copper
      - name: Check command selection and the actual copper lsp language server providers
        env:
          COPPER_TEST_BIN: target/release/copper${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node --test tests/compiler-client.cjs tests/lsp-client.cjs

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/tools/package-lock.json
      - run: npm ci --prefix integrations/vscode/tools --ignore-scripts --no-audit --no-fund
      - name: Check syntax highlighting with the VS Code tokenizer
        run: node --test tests/syntax-highlighting.cjs
      - name: Require extension tag to match its manifest
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: node integrations/vscode/release.cjs check-tag
      - name: Stage shared assets and package with official Marketplace tooling
        run: |
          node integrations/vscode/build.cjs
          mkdir -p build/extension-dist
          cd build/vscode-extension/extension
          ../../../integrations/vscode/tools/node_modules/.bin/vsce package --no-dependencies --out ../../extension-dist/copperscript.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copperscript-extension
          path: build/extension-dist/copperscript.vsix
          if-no-files-found: error

  publish:
    if: github.repository == 'andenore/CopperScript' && startsWith(github.ref, 'refs/tags/extension-v') && vars.COPPER_MARKETPLACE_ENABLED == 'true'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    concurrency:
      group: copperscript-marketplace
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/tools/package-lock.json
      - run: npm ci --prefix integrations/vscode/tools --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: copperscript-extension
          path: build/extension-dist
      - name: Authenticate publisher identity through GitHub OIDC
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the exact tested VSIX
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: integrations/vscode/tools/node_modules/.bin/vsce publish --packagePath build/extension-dist/copperscript.vsix --azure-credential

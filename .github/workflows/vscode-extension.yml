name: CopperScript VS Code extension

on:
  push:
    branches: ['**']
    tags: ['extension-v*']
    paths:
      - '.github/workflows/vscode-extension.yml'
      - 'integrations/vscode/**'
      - 'pcbir/**'
      - 'copperscript/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'copper.mod'
      - 'copper.lock'
      - 'examples/**'
  pull_request:
    paths:
      - '.github/workflows/vscode-extension.yml'
      - 'integrations/vscode/**'
      - 'pcbir/**'
      - 'copperscript/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'copper.mod'
      - 'copper.lock'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - {os: windows-latest, python: '3.15'}
          - {os: macos-latest, python: '3.15'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install compiler and focused test tools
        run: python -m pip install -e ".[test]"
      - name: Check compiler, LSP, mechanical host and packaging
        run: python -m pytest tests/test_compiler.py tests/test_packages.py tests/test_lsp.py tests/test_editor_document.py tests/test_editor_packaging.py
      - name: Check interpreter discovery and actual language server providers
        env:
          COPPER_TEST_PYTHON: python
        run: node --test tests/compiler-client.cjs tests/lsp-client.cjs

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/tools/package-lock.json
      - run: npm ci --prefix integrations/vscode/tools --ignore-scripts --no-audit --no-fund
      - name: Require extension tag to match its manifest
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: node integrations/vscode/release.cjs check-tag
      - name: Stage shared assets and package with official Marketplace tooling
        run: |
          node integrations/vscode/build.cjs
          mkdir -p build/extension-dist
          cd build/vscode-extension/extension
          ../../../integrations/vscode/tools/node_modules/.bin/vsce package --no-dependencies --out ../../extension-dist/copperscript.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copperscript-extension
          path: build/extension-dist/copperscript.vsix
          if-no-files-found: error

  publish:
    if: github.repository == 'andenore/CopperScript' && startsWith(github.ref, 'refs/tags/extension-v') && vars.COPPER_MARKETPLACE_ENABLED == 'true'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    concurrency:
      group: copperscript-marketplace
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/tools/package-lock.json
      - run: npm ci --prefix integrations/vscode/tools --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: copperscript-extension
          path: build/extension-dist
      - name: Authenticate publisher identity through GitHub OIDC
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the exact tested VSIX
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: integrations/vscode/tools/node_modules/.bin/vsce publish --packagePath build/extension-dist/copperscript.vsix --azure-credential

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copperscript"
version = "0.1.0"
description = "A semantic, strongly typed language for PCB connectivity and electrical intent"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PCB DSL prototype contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
cam = ["pygerber==2.4.3"]
simulation = ["matplotlib>=3.10,<4", "plotly>=6.3,<7"]

[project.scripts]
copper = "pcbir.cli:main"
copper-devicegen = "pcbir.devicegen:main"

[project.entry-points."copperscript.libraries"]
tiny = "copperscript.library_data:tiny_library"
standard = "copperscript.library_data:tiny_library"

[tool.setuptools]
packages = ["copperscript", "pcbir", "pcbir.backends", "pcbir.importers", "pcbir.simulation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
